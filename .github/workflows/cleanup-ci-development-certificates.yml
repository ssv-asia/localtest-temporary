name: Revoke unused CI development certificates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revoke:
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Verify and revoke only the identified CI development certificates
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const candidates = new Map([
            ['2GS3825NKZ', '6FC82B6B4AE80F718E45C24CD827E05'],
            ['3BNRS28G78', '5ED6E7783B8E02A65E7B475544F02202'],
            ['5Q553S9HAZ', '4E7DBB7378E7C53690D91925FC9AEC89'],
            ['938BWWJGCG', '32CBE64850BBC79BDC05ABFD05DBC57D'],
            ['A54U5PQ3BS', '33DFEDBBED5024C7156BA9E9DA52AAB9'],
            ['BA6CD2JA5L', '134CC70F07BA205DFCB0E364D03EB3DF'],
            ['F2B9S73577', '7BFCAB6C6ED03C0457D3669833DA5354'],
            ['F3N3A26KQA', '5B56A0F59D35050701E40B424E8FB8D0'],
            ['G9P8TBMX5N', '6BD8750030E8C5F03A4F4E8D18185FF2'],
            ['J855VLFL3T', '30416DA606494A0C6187A749CE27A12'],
          ]);
          for (const name of ['APP_STORE_CONNECT_KEY_ID', 'APP_STORE_CONNECT_ISSUER_ID', 'APP_STORE_CONNECT_PRIVATE_KEY']) {
            if (!process.env[name]) throw new Error(`Missing ${name}`);
          }

          const b64url = (value) => Buffer.from(value).toString('base64url');
          const issuedAt = Math.floor(Date.now() / 1000);
          const header = b64url(JSON.stringify({ alg: 'ES256', kid: process.env.APP_STORE_CONNECT_KEY_ID, typ: 'JWT' }));
          const payload = b64url(JSON.stringify({ iss: process.env.APP_STORE_CONNECT_ISSUER_ID, iat: issuedAt, exp: issuedAt + 900, aud: 'appstoreconnect-v1' }));
          const unsigned = `${header}.${payload}`;
          const signature = crypto.sign('sha256', Buffer.from(unsigned), {
            key: process.env.APP_STORE_CONNECT_PRIVATE_KEY.replace(/\\n/g, '\n'),
            dsaEncoding: 'ieee-p1363',
          });
          const token = `${unsigned}.${signature.toString('base64url')}`;
          const baseUrl = 'https://api.appstoreconnect.apple.com';

          async function request(url, method = 'GET') {
            const response = await fetch(url, { method, headers: { Authorization: `Bearer ${token}` } });
            const body = response.status === 204 ? null : await response.json();
            if (!response.ok) throw new Error(`Apple API ${method} ${url} failed (${response.status}): ${JSON.stringify(body?.errors ?? body)}`);
            return body;
          }

          (async () => {
            const inventory = await request(`${baseUrl}/v1/certificates?limit=200&fields%5Bcertificates%5D=displayName,certificateType,serialNumber,expirationDate`);
            const profiles = await request(`${baseUrl}/v1/profiles?limit=200&include=certificates&fields%5Bprofiles%5D=name,profileType,profileState,expirationDate&fields%5Bcertificates%5D=displayName,certificateType,serialNumber,expirationDate`);
            const profileReferences = new Set();
            for (const profile of profiles.data ?? []) {
              for (const cert of profile.relationships?.certificates?.data ?? []) profileReferences.add(cert.id);
            }

            const byId = new Map((inventory.data ?? []).map((cert) => [cert.id, cert]));
            for (const [id, expectedSerial] of candidates) {
              const certificate = byId.get(id);
              if (!certificate) throw new Error(`Refusing to revoke ${id}: certificate was not found in current inventory.`);
              const { certificateType, displayName, serialNumber } = certificate.attributes ?? {};
              if (certificateType !== 'DEVELOPMENT' || displayName !== 'Created via API' || serialNumber !== expectedSerial) {
                throw new Error(`Refusing to revoke ${id}: current attributes do not match the audited CI Development certificate.`);
              }
              if (profileReferences.has(id)) throw new Error(`Refusing to revoke ${id}: a portal-listed profile references it.`);
              console.log(`Revoking audited CI Development certificate ${id} (${serialNumber}); no portal-listed profile references it.`);
              await request(`${baseUrl}/v1/certificates/${id}`, 'DELETE');
              console.log(`Revoked ${id}.`);
            }
            console.log(`Revoked ${candidates.size} verified CI-created Development certificates. Distribution Managed and unrelated certificates were not targeted.`);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

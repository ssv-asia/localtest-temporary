name: iOS App Store signed IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: xcode-27
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 1093163336745-1m9gq2ka957532pd75mr339kltu8muop.apps.googleusercontent.com
      EXPO_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GITHUB_CLIENT_ID }}
      EXPERT_AI_APS_ENVIRONMENT: production
      EAS_BUILD_PROFILE: production
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Check required App Store Connect credentials
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$EXPO_PUBLIC_GITHUB_CLIENT_ID"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]

      - name: Verify current App Store toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -Eq 'iphoneos27\.'

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Generate production iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Verify production signing targets and capabilities
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const config = JSON.parse(execFileSync('npx', ['expo', 'config', '--type', 'public', '--json'], { encoding: 'utf8' }));
          if (config.ios?.bundleIdentifier !== 'com.ssvasia.expertai') throw new Error('Production app bundle ID is incorrect.');
          if (config.extra?.googleIosClientId !== process.env.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID) throw new Error('Production Google OAuth client was not configured.');
          if (config.extra?.githubClientId !== process.env.EXPO_PUBLIC_GITHUB_CLIENT_ID) throw new Error('Production GitHub OAuth client was not configured.');
          const project = fs.readFileSync('ios/ExpertAI.xcodeproj/project.pbxproj', 'utf8');
          if (!project.includes('com.ssvasia.expertai.share-extension')) throw new Error('Production Share Extension ID is missing.');
          if (project.includes('com.local.expertai')) throw new Error('Local-test bundle ID leaked into the production project.');
          const info = JSON.parse(execFileSync('plutil', ['-convert', 'json', '-o', '-', 'ios/ExpertAI/Info.plist'], { encoding: 'utf8' }));
          const scene = info.UIApplicationSceneManifest?.UISceneConfigurations?.UIWindowSceneSessionRoleApplication?.[0];
          if (scene?.UISceneDelegateClassName !== '$(PRODUCT_MODULE_NAME).ExpertAISceneDelegate') throw new Error('iOS scene lifecycle configuration is missing.');
          if (info.UIApplicationShortcutItems?.length !== 4) throw new Error('The four iOS Home Screen Quick Actions were not generated.');
          const appDelegate = fs.readFileSync('ios/ExpertAI/AppDelegate.swift', 'utf8');
          if (!appDelegate.includes('expert-ai-ios-scene-lifecycle')) throw new Error('iOS scene delegate was not generated.');
          if (!appDelegate.includes('connectionOptions.shortcutItem')) throw new Error('Cold-start scene Quick Actions are not routed.');
          if (!appDelegate.includes('routedQuickActionDuringLaunch')) throw new Error('Warm-start Quick Actions were not preserved.');
          if (appDelegate.includes('window = UIWindow(frame: UIScreen.main.bounds)')) throw new Error('Legacy app-delegate window startup remains enabled.');
          const entitlements = JSON.parse(execFileSync('plutil', ['-convert', 'json', '-o', '-', 'ios/ExpertAI/ExpertAI.entitlements'], { encoding: 'utf8' }));
          if (entitlements['aps-environment'] !== 'production') throw new Error('Production APNs entitlement is missing.');
          if (entitlements['com.apple.security.application-groups']?.[0] !== 'group.com.ssvasia.expertai') throw new Error('Production app group is missing.');
          if (!entitlements['com.apple.developer.applesignin']?.includes('Default')) throw new Error('Sign in with Apple capability is missing.');
          NODE

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Cache Xcode build products
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ios-derived-data-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('yarn.lock', 'ios/Podfile.lock', 'app.json') }}
          restore-keys: |
            ios-derived-data-${{ runner.os }}-${{ runner.arch }}-xcode27-

      - name: Prepare App Store Connect key for Xcode automatic signing
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          unset APP_STORE_CONNECT_PRIVATE_KEY

      - name: Archive with Xcode automatic distribution signing
        run: >-
          xcodebuild -workspace ios/ExpertAI.xcworkspace
          -scheme ExpertAI -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/ExpertAI.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$APPLE_API_KEY_PATH"
          -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
          -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          archive

      - name: Export App Store Connect IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ExpertAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          mkdir -p release
          cp "$RUNNER_TEMP/export/ExpertAI.ipa" release/ExpertAI-App-Store.ipa
          unzip -tq release/ExpertAI-App-Store.ipa
          shasum -a 256 release/ExpertAI-App-Store.ipa > release/ExpertAI-App-Store.ipa.sha256
          mkdir -p "$RUNNER_TEMP/exported-ipa"
          unzip -q release/ExpertAI-App-Store.ipa -d "$RUNNER_TEMP/exported-ipa"
          APP="$RUNNER_TEMP/exported-ipa/Payload/ExpertAI.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGNED_ENTITLEMENTS="$RUNNER_TEMP/signed-app-entitlements.plist"
          codesign --display --entitlements :- "$APP" > "$SIGNED_ENTITLEMENTS" 2> "$RUNNER_TEMP/codesign-entitlements.log"
          plutil -lint "$SIGNED_ENTITLEMENTS"
          SIGNED_APPLE_SIGNIN=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' "$SIGNED_ENTITLEMENTS")
          SIGNED_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$SIGNED_ENTITLEMENTS")
          SIGNED_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$SIGNED_ENTITLEMENTS")
          SIGNED_APS_ENVIRONMENT=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$SIGNED_ENTITLEMENTS")
          SIGNED_APP_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$SIGNED_ENTITLEMENTS")
          SIGNED_ASSOCIATED_DOMAIN=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains:0' "$SIGNED_ENTITLEMENTS")
          SIGNED_KEYCHAIN_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$SIGNED_ENTITLEMENTS")
          test "$SIGNED_APPLE_SIGNIN" = "Default"
          test "$SIGNED_APP_ID" = "${APPLE_TEAM_ID}.com.ssvasia.expertai"
          test "$SIGNED_TEAM_ID" = "$APPLE_TEAM_ID"
          test "$SIGNED_APS_ENVIRONMENT" = "production"
          test "$SIGNED_APP_GROUP" = "group.com.ssvasia.expertai"
          test "$SIGNED_ASSOCIATED_DOMAIN" = "applinks:ssv.asia"
          test "$SIGNED_KEYCHAIN_GROUP" = "${APPLE_TEAM_ID}.com.ssvasia.expertai"

          PROFILE_PLIST="$RUNNER_TEMP/embedded-profile.plist"
          security cms -D -i "$APP/embedded.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_APPLE_SIGNIN=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APS_ENVIRONMENT=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST")
          PROFILE_APP_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$PROFILE_PLIST")
          test "$PROFILE_APPLE_SIGNIN" = "Default"
          test "$PROFILE_APP_ID" = "$SIGNED_APP_ID"
          test "$PROFILE_TEAM_ID" = "$APPLE_TEAM_ID"
          test "$PROFILE_APS_ENVIRONMENT" = "$SIGNED_APS_ENVIRONMENT"
          test "$PROFILE_APP_GROUP" = "$SIGNED_APP_GROUP"
          printf 'Verified signed capabilities: Apple Sign In=%s; APNs=%s; App Group=%s; keychain=%s; App ID=%s\n' "$SIGNED_APPLE_SIGNIN" "$SIGNED_APS_ENVIRONMENT" "$SIGNED_APP_GROUP" "$SIGNED_KEYCHAIN_GROUP" "$SIGNED_APP_ID"
          for SIGNED_BUNDLE in "$APP" "$APP/PlugIns/ShareExtension.appex"; do
            SIGNING_DETAILS=$(codesign --display --verbose=4 "$SIGNED_BUNDLE" 2>&1)
            printf '%s\n' "$SIGNING_DETAILS"
            if ! printf '%s\n' "$SIGNING_DETAILS" | grep -q '^Authority=Apple Distribution:'; then
              echo "Expected Apple Distribution signing for $SIGNED_BUNDLE."
              exit 1
            fi
          done
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          EXT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/PlugIns/ShareExtension.appex/Info.plist")
          test "$BUNDLE" = "com.ssvasia.expertai"
          test "$EXT" = "com.ssvasia.expertai.share-extension"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          printf 'Signing: App Store distribution\nBundle: %s\nShare Extension: %s\nVersion/build: %s (%s)\n' "$BUNDLE" "$EXT" "$VERSION" "$BUILD" > release/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ExpertAI-App-Store-signed
          path: release/
          if-no-files-found: error
          retention-days: 14
